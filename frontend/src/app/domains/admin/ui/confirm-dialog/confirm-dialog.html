<dialog
  #dialog
  class="m-auto w-full max-w-sm rounded-xl bg-white p-6 shadow-xl backdrop:bg-slate-900/40"
  aria-labelledby="confirm-title"
  (cancel)="$event.preventDefault(); closed.emit()"
>
  <h2 id="confirm-title" class="text-lg font-semibold">{{ heading() }}</h2>
  <div class="mt-2 text-sm text-slate-600"><ng-content /></div>
  @if (error(); as message) {
    <p class="mt-3 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ message }}</p>
  }
  <div class="mt-5 flex justify-end gap-2">
    <button
      type="button"
      class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
      (click)="closed.emit()"
    >{{ cancelLabel() }}</button>
    <button
      type="button"
      class="rounded-md px-4 py-2 text-sm font-medium text-white disabled:opacity-60"
      [class]="destructive() ? 'bg-red-600 hover:bg-red-500' : 'bg-indigo-600 hover:bg-indigo-500'"
      [disabled]="busy()"
      (click)="confirmed.emit()"
    >{{ confirmLabel() }}</button>
  </div>
</dialog>
