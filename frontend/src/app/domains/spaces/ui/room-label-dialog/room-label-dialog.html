<dialog
  #dialog
  class="m-auto w-full max-w-sm rounded-xl bg-white p-6 shadow-xl backdrop:bg-slate-900/40"
  aria-labelledby="room-label-title"
  (cancel)="$event.preventDefault(); closed.emit()"
>
  <h2 id="room-label-title" class="text-lg font-semibold">{{ title() }}</h2>

  <form class="mt-4 space-y-4" novalidate (submit)="$event.preventDefault(); save()">
    <div>
      <label for="room-label" class="block text-sm font-medium text-slate-700" i18n="@@roomLabel.label">Label</label>
      <input
        id="room-label"
        type="text"
        autocomplete="off"
        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        [formField]="form.label"
      />
      @if (form.label().invalid() && form.label().touched()) {
        <p class="mt-1 text-xs text-red-600" role="alert" i18n="@@roomLabel.invalid">Enter a label of at most 80 characters.</p>
      }
    </div>

    <div class="flex justify-end gap-2">
      <button
        type="button"
        class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
        (click)="closed.emit()"
        i18n="@@roomLabel.cancel"
      >Cancel</button>
      <button
        type="submit"
        class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500"
      >{{ saveLabel() }}</button>
    </div>
  </form>
</dialog>
