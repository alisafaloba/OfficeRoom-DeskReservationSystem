<dialog
  #dialog
  class="m-auto w-full max-w-sm rounded-xl bg-white p-6 shadow-xl backdrop:bg-slate-900/40"
  aria-labelledby="calibration-title"
  (cancel)="$event.preventDefault(); closed.emit()"
>
  <h2 id="calibration-title" class="text-lg font-semibold" i18n="@@calibration.title">Set the scale</h2>
  <p class="mt-1 text-sm text-slate-600" i18n="@@calibration.measured">At the current scale the two points are {{ measuredMetres() }} m apart.</p>

  <form class="mt-4 space-y-4" novalidate (submit)="$event.preventDefault(); save(distance)">
    <div>
      <label for="calibration-distance" class="block text-sm font-medium text-slate-700" i18n="@@calibration.label">Real distance (m)</label>
      <input
        #distance
        id="calibration-distance"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        [attr.aria-invalid]="invalid()"
        [attr.aria-describedby]="invalid() ? 'calibration-error' : null"
      />
      @if (invalid()) {
        <p id="calibration-error" class="mt-1 text-xs text-red-600" role="alert" i18n="@@calibration.invalid">Enter a distance in metres above 0, e.g. 5.40.</p>
      }
    </div>

    <div class="flex justify-end gap-2">
      <button
        type="button"
        class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
        (click)="closed.emit()"
        i18n="@@calibration.cancel"
      >Cancel</button>
      <button
        type="submit"
        class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500"
        i18n="@@calibration.save"
      >Set scale</button>
    </div>
  </form>
</dialog>
