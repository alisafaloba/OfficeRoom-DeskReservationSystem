<div
  role="group"
  aria-label="Decorative elements"
  i18n-aria-label="@@decorPalette.label"
  class="flex flex-row flex-wrap gap-1 rounded-lg lg:flex-col border border-slate-200 bg-white p-1 shadow-sm"
>
  <span class="px-2 text-xs font-semibold uppercase tracking-wide text-slate-500" i18n="@@decorPalette.title">Decor</span>
  @for (k of kinds; track k) {
    <button
      type="button"
      class="rounded-md px-3 py-1.5 text-sm lg:w-full lg:text-left font-medium text-slate-700 hover:bg-slate-100 aria-pressed:bg-indigo-600 aria-pressed:text-white"
      [attr.aria-pressed]="tool() === 'DECOR' && kind() === k"
      (click)="kindChosen.emit(k)"
    >{{ labels[k] }}</button>
  }
</div>
