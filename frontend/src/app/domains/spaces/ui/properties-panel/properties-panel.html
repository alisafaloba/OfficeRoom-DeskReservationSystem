<aside
  class="flex w-full shrink-0 flex-col gap-6 overflow-y-auto lg:h-full lg:w-60 rounded-xl border border-slate-200 bg-white p-4 shadow-sm"
  aria-label="Properties"
  i18n-aria-label="@@properties.title"
>
  <section aria-labelledby="properties-selection">
    <h2
      id="properties-selection"
      class="text-xs font-semibold uppercase tracking-wide text-slate-500"
      i18n="@@properties.selection"
    >Selection</h2>
    @if (element()) {
      <p class="mt-2 text-sm font-medium text-slate-900">{{ typeLabel() }}</p>
      <dl class="mt-1 space-y-1 text-sm text-slate-600">
        @for (detail of details(); track detail.name) {
          <div class="flex justify-between gap-3">
            <dt>{{ detail.name }}</dt>
            <dd class="text-right text-slate-900">{{ detail.value }}</dd>
          </div>
        }
      </dl>
      <button
        type="button"
        class="mt-3 w-full rounded-md border border-red-200 px-3 py-1.5 text-sm font-medium text-red-700 hover:bg-red-50"
        (click)="deleted.emit()"
        i18n="@@properties.delete"
      >Delete</button>
    } @else {
      <p class="mt-2 text-sm text-slate-500" i18n="@@properties.nothingSelected">Nothing selected.</p>
    }
  </section>

  <section aria-labelledby="properties-view">
    <h2
      id="properties-view"
      class="text-xs font-semibold uppercase tracking-wide text-slate-500"
      i18n="@@properties.view"
    >View</h2>
    <div class="mt-2 flex items-center justify-between gap-2">
      <button
        type="button"
        class="size-8 rounded-md border border-slate-200 text-base font-medium text-slate-700 hover:bg-slate-50"
        aria-label="Zoom out"
        i18n-aria-label="@@floorPlan.zoomOut"
        (click)="zoomedOut.emit()"
      >−</button>
      <output class="text-sm tabular-nums text-slate-900" aria-live="polite">{{ zoomPercent() }}%</output>
      <button
        type="button"
        class="size-8 rounded-md border border-slate-200 text-base font-medium text-slate-700 hover:bg-slate-50"
        aria-label="Zoom in"
        i18n-aria-label="@@floorPlan.zoomIn"
        (click)="zoomedIn.emit()"
      >+</button>
    </div>
    <button
      type="button"
      class="mt-2 w-full rounded-md border border-slate-200 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50"
      (click)="fitted.emit()"
      i18n="@@floorPlan.fit"
    >Fit to screen</button>
  </section>

  <section aria-labelledby="properties-grid">
    <h2
      id="properties-grid"
      class="text-xs font-semibold uppercase tracking-wide text-slate-500"
      i18n="@@properties.grid"
    >Grid</h2>
    <button
      type="button"
      class="mt-2 w-full rounded-md border px-3 py-1.5 text-sm font-medium"
      [class]="snap() ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-200 text-slate-700 hover:bg-slate-50'"
      [attr.aria-pressed]="snap()"
      (click)="snapToggled.emit()"
      i18n="@@floorPlan.snap"
    >Snap to grid</button>
    <label class="mt-3 block text-sm text-slate-600">
      <span i18n="@@properties.gridSize">Grid size</span>
      <select
        class="mt-1 block w-full rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm"
        (change)="chooseSize($event)"
      >
        @for (size of gridSizes; track size) {
          <option [value]="size" [selected]="size === gridSize()">{{ size }} cm</option>
        }
      </select>
    </label>
  </section>
</aside>
