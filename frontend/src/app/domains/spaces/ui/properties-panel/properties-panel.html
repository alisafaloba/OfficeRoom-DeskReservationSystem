<aside
  class="w-full rounded-xl border border-slate-200 bg-white p-4 shadow-sm lg:w-56"
  aria-labelledby="properties-title"
  data-testid="properties-panel"
>
  <h2 id="properties-title" class="text-sm font-semibold text-slate-900" i18n="@@properties.title">Properties</h2>

  @if (properties(); as current) {
    <div class="mt-3 space-y-3">
      @for (item of fields; track item.field) {
        <div>
          <label [for]="'prop-' + item.field" class="block text-xs font-medium text-slate-600">{{ item.label }}</label>
          <div class="mt-1 flex items-center gap-1">
            <input
              [id]="'prop-' + item.field"
              type="number"
              step="any"
              class="block w-full rounded-md border border-slate-300 px-2 py-1 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200 disabled:bg-slate-100 disabled:text-slate-400"
              [value]="valueOf(current, item.field) ?? ''"
              [disabled]="valueOf(current, item.field) === null"
              (change)="commit(item.field, $any($event.target)); reset($any($event.target), valueOf(current, item.field))"
            />
            <span class="w-5 text-xs text-slate-500">{{ item.unit }}</span>
          </div>
        </div>
      }
    </div>
  } @else if (selectionCount() > 1) {
    <p class="mt-3 text-sm text-slate-600" i18n="@@properties.multiple">Several elements selected. Drag to move them all, Delete removes them.</p>
  } @else {
    <p class="mt-3 text-sm text-slate-600" i18n="@@properties.none">Select an element to edit its position, size and angle.</p>
  }
</aside>
