<aside
  class="w-full rounded-xl border border-slate-200 bg-white p-4 shadow-sm"
  aria-labelledby="unplaced-title"
  data-testid="unplaced-resources"
>
  <h2 id="unplaced-title" class="flex items-center gap-1.5 text-sm font-semibold text-slate-900">
    <span class="inline-block size-2 rounded-full bg-amber-500" aria-hidden="true"></span>
    <span i18n="@@unplaced.title">Not on the plan</span>
    <span class="ml-auto rounded-full bg-slate-100 px-2 text-xs font-medium tabular-nums text-slate-600">{{ resources().length }}</span>
  </h2>

  @if (resources().length === 0) {
    <p class="mt-3 text-sm text-slate-600" i18n="@@unplaced.empty">Every resource of this floor is on the plan.</p>
  } @else {
    <p class="mt-1 text-xs text-slate-500" i18n="@@unplaced.hint">Drag a resource onto the plan to place it.</p>
    <ul class="mt-3 max-h-72 space-y-1 overflow-y-auto">
      @for (resource of resources(); track resource.id) {
        <li
          draggable="true"
          class="flex cursor-grab items-center gap-2 rounded-md border border-dashed border-amber-400 bg-amber-50 px-2 py-1 text-sm active:cursor-grabbing"
          [attr.data-resource-id]="resource.id"
          (dragstart)="dragStart($event, resource)"
        >
          <span class="min-w-0 flex-1">
            <span class="block truncate font-medium text-slate-900">{{ resource.name }}</span>
            <span class="block text-xs text-slate-500">{{ typeNames[resource.type] }}</span>
          </span>
          <button
            type="button"
            class="rounded px-1.5 py-0.5 text-xs font-medium text-indigo-700 hover:bg-indigo-100"
            aria-label="Place {{ resource.name }}"
            i18n-aria-label="@@unplaced.placeLabel"
            (click)="placed.emit(resource.id)"
            i18n="@@unplaced.place"
          >Place</button>
        </li>
      }
    </ul>
  }
</aside>
