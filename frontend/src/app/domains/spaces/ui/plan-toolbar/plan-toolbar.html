<div
  role="toolbar"
  aria-label="Drawing tools"
  i18n-aria-label="@@planToolbar.label"
  class="flex flex-row flex-wrap gap-1 rounded-lg lg:flex-col border border-slate-200 bg-white p-1 shadow-sm"
>
  @for (button of buttons; track button.tool) {
    <button
      type="button"
      class="rounded-md px-3 py-1.5 text-sm lg:w-full lg:text-left font-medium text-slate-700 hover:bg-slate-100 aria-pressed:bg-indigo-600 aria-pressed:text-white"
      [attr.aria-pressed]="tool() === button.tool"
      (click)="toolChosen.emit(button.tool)"
    >{{ button.label }}</button>
  }
  <ng-content />
</div>
