<svg
  class="block size-full touch-none select-none bg-white focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400"
  [class.cursor-crosshair]="drawing()"
  xmlns="http://www.w3.org/2000/svg"
  data-testid="plan-canvas"
  tabindex="0"
  role="application"
  [attr.aria-label]="label()"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerCancel()"
  (dblclick)="doubleClicked.emit()"
  (wheel)="onWheel($event)"
  (keydown)="onKeyDown($event)"
  (keyup)="onKeyUp($event)"
  (blur)="onBlur()"
>
  <defs>
    <!-- Icons are stretched to the element's size in plan units (preserveAspectRatio none). -->
    <symbol id="plan-desk" viewBox="0 0 140 70" preserveAspectRatio="none">
      <rect x="2" y="2" width="136" height="66" rx="6" class="fill-indigo-100 stroke-indigo-700" stroke-width="4" />
      <rect x="45" y="12" width="50" height="8" rx="2" class="fill-indigo-700" />
      <rect x="52" y="40" width="36" height="18" rx="9" class="fill-indigo-300" />
    </symbol>
    <symbol id="plan-door" viewBox="0 0 90 20" preserveAspectRatio="none">
      <rect x="0" y="6" width="90" height="8" class="fill-white" />
      <path d="M0 10 H4 M86 10 H90" class="stroke-stone-500" stroke-width="3" fill="none" />
    </symbol>
    <symbol id="plan-window" viewBox="0 0 120 20" preserveAspectRatio="none">
      <rect x="0" y="2" width="120" height="16" class="fill-sky-100 stroke-sky-600" stroke-width="2" />
      <path d="M0 10 H120" class="stroke-sky-600" stroke-width="2" />
    </symbol>
    <symbol id="plan-stairs" viewBox="0 0 120 240" preserveAspectRatio="none">
      <rect x="1" y="1" width="118" height="238" class="fill-stone-50 stroke-stone-500" stroke-width="2" />
      <path
        d="M1 40 H119 M1 80 H119 M1 120 H119 M1 160 H119 M1 200 H119"
        class="stroke-stone-500"
        stroke-width="2"
      />
    </symbol>
    <symbol id="plan-elevator" viewBox="0 0 200 200" preserveAspectRatio="none">
      <rect x="2" y="2" width="196" height="196" class="fill-stone-50 stroke-stone-500" stroke-width="4" />
      <path d="M2 2 L198 198 M198 2 L2 198" class="stroke-stone-400" stroke-width="3" />
    </symbol>
    <symbol id="plan-plant" viewBox="0 0 60 60" preserveAspectRatio="none">
      <circle cx="30" cy="30" r="27" class="fill-green-200 stroke-green-700" stroke-width="3" />
      <circle cx="30" cy="30" r="12" class="fill-green-500" />
    </symbol>
  </defs>

  <g [attr.transform]="worldTransform()">
    @for (element of elements(); track element.id) {
      @switch (element.type) {
        @case ('ZONE') {
          <g data-element="ZONE">
            <polygon
              [attr.points]="points(element.points)"
              class="fill-sky-500/25 stroke-sky-600"
              stroke-width="1.5"
              stroke-dasharray="6 4"
              vector-effect="non-scaling-stroke"
            >
              @if (element.label) {
                <title>{{ element.label }}</title>
              }
            </polygon>
          </g>
        }
        @case ('ROOM') {
          <g data-element="ROOM">
            <polygon
              [attr.points]="points(element.points)"
              class="fill-amber-100 stroke-amber-700"
              stroke-width="2"
              vector-effect="non-scaling-stroke"
            >
              <title>{{ element.label }}</title>
            </polygon>
          </g>
        }
        @case ('DECOR') {
          <g data-element="DECOR" [attr.data-kind]="element.kind" [attr.transform]="placedTransform(element.position, element.rotation)">
            <use
              [attr.href]="'#plan-' + element.kind.toLowerCase()"
              [attr.x]="-element.width / 2"
              [attr.y]="-element.height / 2"
              [attr.width]="element.width"
              [attr.height]="element.height"
            />
          </g>
        }
        @case ('WALL') {
          <polyline
            data-element="WALL"
            [attr.points]="points(element.points)"
            [attr.stroke-width]="wallWidth(element.thickness)"
            class="fill-none stroke-slate-800"
            stroke-linejoin="miter"
            stroke-linecap="square"
          />
        }
        @case ('OUTLINE') {
          <polygon
            data-element="OUTLINE"
            [attr.points]="points(element.points)"
            [attr.stroke-width]="wallWidth(element.thickness)"
            class="fill-none stroke-slate-950"
            stroke-linejoin="miter"
          />
        }
        @case ('DESK') {
          <g data-element="DESK" [attr.transform]="placedTransform(element.position, element.rotation)">
            <use
              href="#plan-desk"
              [attr.x]="-element.width / 2"
              [attr.y]="-element.height / 2"
              [attr.width]="element.width"
              [attr.height]="element.height"
            />
          </g>
        }
      }

      @if (selectedIds().has(element.id)) {
        <g data-selection class="pointer-events-none">
          @switch (element.type) {
            @case ('WALL') {
              <polyline
                [attr.points]="points(element.points)"
                [attr.stroke-width]="wallWidth(element.thickness) + selectionPad()"
                class="fill-none stroke-indigo-500/40"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
            }
            @case ('DESK') {
              <rect
                [attr.transform]="placedTransform(element.position, element.rotation)"
                [attr.x]="-element.width / 2"
                [attr.y]="-element.height / 2"
                [attr.width]="element.width"
                [attr.height]="element.height"
                class="fill-none stroke-indigo-500"
                stroke-width="2"
                stroke-dasharray="6 4"
                vector-effect="non-scaling-stroke"
              />
            }
            @case ('DECOR') {
              <rect
                [attr.transform]="placedTransform(element.position, element.rotation)"
                [attr.x]="-element.width / 2"
                [attr.y]="-element.height / 2"
                [attr.width]="element.width"
                [attr.height]="element.height"
                class="fill-none stroke-indigo-500"
                stroke-width="2"
                stroke-dasharray="6 4"
                vector-effect="non-scaling-stroke"
              />
            }
            @default {
              <polygon
                [attr.points]="points(element.points)"
                class="fill-indigo-500/10 stroke-indigo-500"
                stroke-width="3"
                vector-effect="non-scaling-stroke"
              />
            }
          }
        </g>
      }
    }

    <!-- Labels last, so no shape or icon ever covers one. -->
    @for (element of elements(); track element.id) {
      @if (element.type === 'ZONE' || element.type === 'ROOM') {
        @if (element.label) {
          <g [attr.transform]="labelTransform(element.points)" class="pointer-events-none" [attr.data-label-for]="element.type">
            <text
              text-anchor="middle"
              dominant-baseline="middle"
              [attr.font-size]="labelFontPx"
              [class]="element.type === 'ROOM' ? 'fill-amber-950 font-semibold' : 'fill-sky-900 italic'"
              stroke="white"
              stroke-width="3"
              stroke-linejoin="round"
              paint-order="stroke"
            >{{ labelText(element.label, element.points) }}</text>
          </g>
        }
      }
    }

    @if (overlay(); as box) {
      <g data-selection-box class="pointer-events-none">
        <polygon
          [attr.points]="points(box.outline)"
          class="fill-none stroke-indigo-500"
          stroke-width="1.5"
          vector-effect="non-scaling-stroke"
        />
        @if (box.rotate; as rotate) {
          <line
            [attr.x1]="rotate.from.x"
            [attr.y1]="rotate.from.y"
            [attr.x2]="rotate.at.x"
            [attr.y2]="rotate.at.y"
            class="stroke-indigo-500"
            stroke-width="1.5"
            vector-effect="non-scaling-stroke"
          />
          <circle data-handle="rotate" [attr.cx]="rotate.at.x" [attr.cy]="rotate.at.y" [attr.r]="handleRadius() * 1.4" class="fill-indigo-500 stroke-white" stroke-width="1.5" vector-effect="non-scaling-stroke" />
        }
        @for (handle of box.corners; track handle.corner) {
          <rect
            [attr.data-handle]="handle.corner"
            [attr.x]="handle.at.x - handleRadius()"
            [attr.y]="handle.at.y - handleRadius()"
            [attr.width]="handleRadius() * 2"
            [attr.height]="handleRadius() * 2"
            class="fill-white stroke-indigo-600"
            stroke-width="1.5"
            vector-effect="non-scaling-stroke"
          />
        }
      </g>
    }

    @if (marquee(); as band) {
      <polygon
        data-marquee
        class="pointer-events-none fill-indigo-500/10 stroke-indigo-600"
        [attr.points]="points(band)"
        stroke-width="1.5"
        stroke-dasharray="4 3"
        vector-effect="non-scaling-stroke"
      />
    }

    @if (preview(); as draft) {
      <g data-draft class="pointer-events-none opacity-70">
        @if (draft.shape === 'rectangle') {
          <polygon
            [attr.points]="points(draft.points)"
            class="fill-indigo-500/15 stroke-indigo-600"
            stroke-width="2"
            stroke-dasharray="6 4"
            vector-effect="non-scaling-stroke"
          />
        } @else {
          <polyline
            [attr.points]="points(draft.points)"
            [attr.stroke-width]="draft.tool === 'WALL' || draft.tool === 'OUTLINE' ? wallWidth(20) : 2"
            [attr.vector-effect]="draft.tool === 'WALL' || draft.tool === 'OUTLINE' ? null : 'non-scaling-stroke'"
            class="fill-indigo-500/10 stroke-indigo-600"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
          @for (point of draft.points; track $index) {
            <circle [attr.cx]="point.x" [attr.cy]="point.y" [attr.r]="handleRadius()" class="fill-white stroke-indigo-600" stroke-width="1" />
          }
        }
      </g>
    }
  </g>
</svg>
