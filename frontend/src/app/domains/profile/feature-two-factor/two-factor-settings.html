<section class="mx-auto w-full max-w-2xl space-y-6">
  <header>
    <a
      routerLink="/profile"
      class="text-sm font-medium text-indigo-600 hover:text-indigo-500"
      i18n="@@twoFactor.back"
    >Back to profile</a>
    <h1 class="mt-2 text-2xl font-semibold tracking-tight" i18n="@@twoFactor.title">
      Two-factor authentication
    </h1>
  </header>

  <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6">
    <p class="text-sm font-medium text-slate-700" data-testid="two-factor-status">
      @if (user()?.twoFactorEnabled) {
        <ng-container i18n="@@twoFactor.on">Two-factor authentication is on.</ng-container>
      } @else {
        <ng-container i18n="@@twoFactor.off">Two-factor authentication is off.</ng-container>
      }
    </p>
    <p class="mt-2 text-sm text-slate-600" i18n="@@twoFactor.unavailable">
      Setting up or turning off two-factor authentication is not available yet.
    </p>
  </div>
</section>
