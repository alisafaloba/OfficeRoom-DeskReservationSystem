<div
  class="mb-6 flex items-start gap-3 rounded-md border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800"
  role="status"
  aria-live="polite"
>
  <p class="flex-1">{{ message() }}</p>
  <button
    type="button"
    class="font-medium text-amber-700 hover:text-amber-900"
    aria-label="Dismiss"
    i18n-aria-label="@@notification.dismiss"
    (click)="dismissed.emit()"
  >
    <span aria-hidden="true">&times;</span>
  </button>
</div>
