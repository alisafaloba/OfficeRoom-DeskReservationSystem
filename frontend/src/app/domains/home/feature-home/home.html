@if (user(); as u) {
  <section class="space-y-6">
    <header>
      <h1 class="text-2xl font-semibold tracking-tight" i18n="@@home.title">Dashboard</h1>
      <p class="mt-1 text-slate-600">
        {{ u.email }}
        <span
          class="ml-2 rounded-full bg-indigo-50 px-2.5 py-0.5 text-xs font-medium text-indigo-700"
          >{{ u.role | roleLabel }}</span
        >
      </p>
    </header>

    <div class="rounded-xl border border-slate-200 bg-white px-6 py-8 shadow-sm">
      <p class="text-sm text-slate-600" i18n="@@home.welcome">
        Welcome! Your floor plans and bookings will appear here.
      </p>
    </div>
  </section>
}
